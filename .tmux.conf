# Vim-like pane navigation (Ctrl+b then hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Splits inherit current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Enable vi mode in copy mode
setw -g mode-keys vi
set -g mode-keys vi

# Ctrl+u/d for page up/down in copy mode
bind -T copy-mode-vi C-u send-keys -X halfpage-up
bind -T copy-mode-vi C-d send-keys -X halfpage-down

# Enter copy mode with Ctrl+b [
# Then use vi keys: hjkl to move, v to select, y to yank

# Mouse support
set -g mouse on

# Increase scrollback buffer
set -g history-limit 10000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Faster escape time (for vim)
set -sg escape-time 10

# Fix SSH agent after reconnect — point all panes to the stable symlink
set -g update-environment "SSH_AUTH_SOCK"
if-shell 'test -S "$HOME/.ssh/ssh_auth_sock"' 'setenv -g SSH_AUTH_SOCK "$HOME/.ssh/ssh_auth_sock"'

# Copy and stay in copy-mode
bind-key -T copy-mode-vi y send-keys -X copy-pipe "xsel -i -p && xsel -o -p | xsel -i -b"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "xsel -i -p && xsel -o -p | xsel -i -b"

# Shift+Enter for multi-line input in terminal coding agents.
bind-key -T root S-Enter send-keys Escape "[13;2u"

# ── Plugins (TPM) ────────────────────────────────────────────────────────────
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'wfxr/tmux-fzf-url'

# Initialize TPM (keep this line at the very bottom of tmux.conf)
if-shell 'test -x "$HOME/.local/share/tmux/plugins/tpm/tpm"' 'run "$HOME/.local/share/tmux/plugins/tpm/tpm"'
